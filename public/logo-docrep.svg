<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradientes Corporativos -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo circular limpio opcional -->
  <rect width="400" height="400" rx="80" fill="#F8FAFC"/>

  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Cara Superior de la Caja -->
    <path d="M160 80 L250 125 L160 170 L70 125 Z" fill="url(#boxTop)" />
    
    <!-- Solapa Superior de Apertura / Detalle -->
    <path d="M160 80 L205 102.5 L115 147.5 L70 125 Z" fill="#3B82F6" opacity="0.4" />

    <!-- Cara Izquierda de la Caja -->
    <path d="M70 125 L160 170 L160 270 L70 225 Z" fill="url(#boxLeft)" />

    <!-- Cara Derecha de la Caja (Transformada en Chulo / Check) -->
    <!-- Fondo base oscuro de la cara derecha -->
    <path d="M160 170 L250 125 L250 225 L160 270 Z" fill="#0D9488" opacity="0.2" />

    <!-- El "Chulo" / Check Dinámico Sobresaliente -->
    <path d="M130 200 L170 240 L270 130 L240 100 L170 180 L145 155 Z" fill="url(#checkGradient)" />
  </g>

  <!-- Texto de la Marca -->
  <text x="200" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="#0F172A" text-anchor="middle" letter-spacing="1">
    DOC<tspan fill="#10B981">REP</tspan>
  </text>
  <text x="200" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#64748B" text-anchor="middle" letter-spacing="4">
    RECEPCIÓN &amp; CUSTODIA
  </text>
</svg>
